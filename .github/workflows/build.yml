name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-${{ runner.image }}-deriveddata-${{ hashFiles('**/*.swift', 'generate_xcodeproj.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.image }}-deriveddata-

      - name: Generate Xcode project
        run: python3 generate_xcodeproj.py

      - name: Build app
        run: |
          xcodebuild \
            -project ShortsLibrary.xcodeproj \
            -scheme ShortsLibrary \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build tests
        run: |
          xcodebuild \
            -project ShortsLibrary.xcodeproj \
            -scheme ShortsLibraryTests \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project ShortsLibrary.xcodeproj \
            -scheme ShortsLibraryTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
